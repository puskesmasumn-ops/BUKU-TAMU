<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Buku Tamu - UPTD PKM UMANEN</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co.com/gKyVX1J/favicon-png.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Mengembalikan background navbar menjadi putih bersih */
        .navbar {
            background-color: #ffffff; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 10px 20px;
            z-index: 20;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        /* Mengembalikan logo ke format aslinya */
        .navbar-brand img {
            height: 40px; 
            margin-right: 12px;
            background-color: transparent; 
            border-radius: 0;
            padding: 0;
        }

        /* Mengembalikan warna tulisan menjadi hijau Puskesmas */
        .navbar-brand h1 {
            margin: 0;
            font-size: 18px; 
            color: #008000; 
            font-weight: bold;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #10b981; 
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <!-- Link Logo -->
            <img src="https://i.ibb.co.com/gKyVX1J/favicon-png.png" alt="Logo Puskesmas">
            <!-- Teks -->
            <h1>UPTD PUSKESMAS UMANEN</h1>
        </div>
    </nav>

    <div class="iframe-container">
        <div id="loader">
            <div class="spinner"></div>
            <div class="loading-text">Memuat Buku Tamu...</div>
        </div>

        <!-- PASTIKAN ANDA MEMASUKKAN KEMBALI LINK APPS SCRIPT DI BAWAH INI -->
        <iframe
            id="app"
            src="https://script.google.com/macros/s/AKfycbz7TJelg-HbnQNvuT9uh7aYGIRB2aL-SWMP5y5YBg7pgRmRiIpci6OnhD2nFiFP4RsW4w/exec"
            allowfullscreen="true"
            onload="hideLoader()">
        </iframe>
    </div>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
        }
        setTimeout(hideLoader, 8000);
    </script>

</body>
</html>
